spring.application.name=travel-jpa

# DB 접속 정보는 환경변수에서 읽는다. ${이름:기본값} 형식은
# "환경변수가 있으면 그 값을, 없으면 콜론 뒤의 기본값을 쓴다"는 뜻이다.
# - Render: DB_URL, DB_USERNAME, DB_PASSWORD 환경변수를 등록해서 사용한다.
# - 로컬: 아래 기본값으로 Docker MariaDB(localhost:3306/travel)에 연결된다.
#   기본값은 로컬 개발용이며, 실제 운영 계정정보는 환경변수로만 넣는다.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/travel}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:localdev}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Use schema migrations for production deployments.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${PORT:8080}
